# Cloud Run deployment template. Documentation only: no resources are created.
# Replace placeholders, provision secrets separately, and obtain explicit deployment approval.
# Deploy to europe-west2 (London) -- e.g. `gcloud run services replace this-file.yaml
# --region=europe-west2`. Data residency during processing (stated on the frontend for
# DPO review) depends on this; the app itself stores nothing, so this region is the
# entire data-residency surface it controls. See .agent/DECISIONS.md, 2026-09-28.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: workspace-migration-toolkit
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '2'
    spec:
      containerConcurrency: 2
      # Cloud Run's maximum. The app's own job allowance grows with file size
      # and stays under this (job_timeout_ceiling, 3300 s).
      timeoutSeconds: 3600
      serviceAccountName: RUNTIME_SERVICE_ACCOUNT
      containers:
        - image: europe-west2-docker.pkg.dev/PROJECT/REPOSITORY/IMAGE:DIGEST_OR_TAG
          ports:
            # End-to-end HTTP/2 (h2c). Over HTTP/1 Cloud Run refuses a request
            # body over 32 MiB; over HTTP/2 it sets no limit (issue #36).
            - name: h2c
              containerPort: 8080
          resources:
            limits:
              cpu: '2'
              memory: 2Gi
          env:
            - name: PUBLIC_BASE_URL
              value: https://YOUR_SERVICE_HOST
            # Publisher conversion (docs/publisher-storage.md). The signer
            # defaults to RUNTIME_SERVICE_ACCOUNT; omit both to turn it off.
            - name: PUBLISHER_BUCKET
              value: YOUR_PICTURE_BUCKET
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: google-client-id
                  key: latest
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: google-client-secret
                  key: latest
            - name: SESSION_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: session-encryption-key
                  key: latest
