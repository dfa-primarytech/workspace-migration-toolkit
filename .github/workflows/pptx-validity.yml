# Checks that a .pptx the converter emits -- in particular one whose embedded
# video was taken out before upload (issue #36) -- is accepted by an OOXML
# implementation that is not our own.
#
# Its own file, like docx-validity.yml: it installs LibreOffice Impress, which
# is slow and only needed here.
name: PPTX validity

on:
  push:
    paths:
      - 'app/workspace_toolkit/pptx.py'
      - 'app/workspace_toolkit/package.py'
      - 'app/workspace_toolkit/pictures.py'
      - 'app/workspace_toolkit/publisher_deck.py'
      - 'tests/platform/test_pptx_*.py'
      - 'tests/platform/test_docx_validity.py'  # its reader markers
      - '.github/workflows/pptx-validity.yml'
  pull_request:
    paths:
      - 'app/workspace_toolkit/pptx.py'
      - 'app/workspace_toolkit/package.py'
      - 'app/workspace_toolkit/pictures.py'
      - 'app/workspace_toolkit/publisher_deck.py'
      - 'tests/platform/test_pptx_*.py'
      - 'tests/platform/test_docx_validity.py'  # its reader markers
      - '.github/workflows/pptx-validity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  libreoffice:
    name: Independent reader accepts our slides
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install LibreOffice Impress
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-impress poppler-utils
          soffice --version
          pdftotext -v

      - name: Install the application
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Convert and re-read with LibreOffice
        # A skipped test here would report green while checking nothing, so a
        # skip fails the job. pytest has no option for that; the summary line
        # is checked instead. WMT_REQUIRE_READERS also makes a missing reader
        # fail its test rather than skip it.
        env:
          WMT_REQUIRE_READERS: '1'
        run: |
          set -o pipefail
          python -m pytest tests/platform/test_pptx_validity.py -v -ra --strict-markers | tee pytest.log
          if grep -Eq '[0-9]+ skipped' pytest.log; then
            echo "::error::a LibreOffice check was skipped, so nothing was checked"
            exit 1
          fi
